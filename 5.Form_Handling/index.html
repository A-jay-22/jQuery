<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Handling</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css
">
    <script src="script.js"></script>
    <script src="https://code.jquery.com/jquery-4.0.0.js" integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>

</head>
<body>
    <h3 class="fw-bold text-lg-center">Form Handling</h3>
    <form id="myForm" class="container mt-4 p-4 border rounded bg-light w-25 d-flex flex-column h-100">
        <label for="name" class="fw-bold" required>First Name</label>
        <input type="text" id="name" name="name" placeholder="Enter your first name" required><br><br>
        <label for="lname" class="fw-bold" required>Last Name</label>
        <input type="text" id="lname" name="lname" placeholder="Enter your last name" required><br><br>
        <label for="age" class="fw-bold" required>Age</label>
        <input type="number" id="age" name="age" placeholder="Enter your age" required><br><br>
        <label for="number" class="fw-bold" required>Phone Number</label>
        <input type="tel" id="number" name="number" placeholder="Enter your phone number" required><br><br>
        <label for="gender" class="fw-bold" required>Gender</label>
        <select id="gender" name="gender" required>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>    
        </select><br><br>
        <label for="email" class="fw-bold" required>Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required><br><br>
        <input type="submit" value="Submit" class="btn btn-primary hover:bg-blue-800 fw-bold">

    </form>
    
</body>
<script>
    $(document).ready(function(){
        $("#myForm").submit(function(){
            $("#name").toggle();
        })
    });
    
</script>
</html>
